:root{--bg:#EDEFEC;--card:#FFFFFF;--ink:#14233A;--soft:#5A6676;--line:#D3D8DD;--navy:#1F4A86;--navy2:#2D63AE;--chip:#E6E9EE;--sel:#DCE7F7;--ok:#23784A;--warn:#9A6200;--bad:#B83227;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171D;--card:#1A222C;--ink:#E4E8EE;--soft:#9BA7B6;--line:#2C3744;--navy:#2A5698;--navy2:#7FA8E8;--chip:#232D39;--sel:#20334F;--ok:#6CCB95;--warn:#FFC864;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#12171D;--card:#1A222C;--ink:#E4E8EE;--soft:#9BA7B6;--line:#2C3744;--navy:#2A5698;--navy2:#7FA8E8;--chip:#232D39;--sel:#20334F;--ok:#6CCB95;--warn:#FFC864;--bad:#FF8A80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'THSarabunPSK','TH SarabunPSK','TH Sarabun New',Tahoma,sans-serif;font-size:21px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy2);outline-offset:2px}
.hidden{display:none!important}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#14233A;color:#fff;display:flex;align-items:center;gap:12px;padding:6px 16px;min-height:54px}
.top .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;border:0;background:none;color:#fff;padding:0;text-align:left}

  cvCur.addEventListener('pointerdown', function (e) { if (tool !== 'pen') return; e.preventDefault(); cvCur.setPointerCapture(e.pointerId); cur = { c: '#E0262B', w: 6, p: [pt(e)] }; (ink[i] = ink[i] || []).push(cur); redraw(); });
  cvCur.addEventListener('pointermove', function (e) { if (tool === 'pen' && cur) { cur.p.push(pt(e)); redraw(); } else if (tool === 'laser') { laser = pt(e); redraw(); } });
  cvCur.addEventListener('pointerup', function () { cur = null; });
  cvCur.addEventListener('pointerleave', function () { if (tool === 'laser') { laser = null; redraw(); } });
  function key(e) {
    var k = e.key;
    if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].indexOf(k) >= 0) { e.preventDefault(); show(i + 1); }
    else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].indexOf(k) >= 0) { e.preventDefault(); show(i - 1); }
    else if (k === 'Home') show(0); else if (k === 'End') show(n - 1);
    else if (k === 'p' || k === 'P') setTool('pen'); else if (k === 'l' || k === 'L') setTool('laser');
    else if (k === 'e' || k === 'E') { ink[i] = []; redraw(); } else if (k === 'b' || k === 'B' || k === '.') setBlack(!black);
    else if ((k === 'n' || k === 'N') && !dual) $('.pv-notes', ov).classList.toggle('hidden');
    else if (k === 'Escape') { if (tool) setTool(tool); else close(); }
  }
  function close() {
    document.removeEventListener('keydown', key); window.removeEventListener('resize', fitAll); clearInterval(tick); clearTimeout(idleT);
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    if (aud && !aud.closed) aud.close(); ov.remove();
  }
  function wake() { if (dual) return; ov.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { ov.classList.add('idle'); }, 2500); }
  var tx0 = null;
  ov.addEventListener('touchstart', function (e) { if (!tool) tx0 = e.touches[0].clientX; }, { passive: true });
  ov.addEventListener('touchend', function (e) { if (tx0 == null) return; var dx = e.changedTouches[0].clientX - tx0; tx0 = null; if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1)); }, { passive: true });
  ov.addEventListener('mousemove', wake);
  ov.addEventListener('click', function (e) {
    var b = e.target.closest('[data-pv]'); wake();
    if (b) { var a = b.dataset.pv;
      if (a === 'prev') show(i - 1); else if (a === 'next') show(i + 1); else if (a === 'x') close(); else if (a === 'pen' || a === 'laser') setTool(a);
      else if (a === 'clear') { ink[i] = []; redraw(); } else if (a === 'black') setBlack(!black); else if (a === 'notes') $('.pv-notes', ov).classList.toggle('hidden');
      else if (a === 'fs') { if (document.fullscreenElement) document.exitFullscreen(); else if (ov.requestFullscreen) ov.requestFullscreen().catch(function () {}); }
      else if (a === 'tp') { if (pausedAt) { t0 += Date.now() - pausedAt; pausedAt = null; b.textContent = 'หยุดเวลา'; } else { pausedAt = Date.now(); b.textContent = 'เดินเวลาต่อ'; } }
      else if (a === 'tr') { t0 = Date.now(); if (pausedAt) pausedAt = Date.now(); }
      else if (a === 'reaud') { aud = window.open('', 'spr_audience', 'width=1280,height=760'); if (aud) { setupAud(); fitAll(); } else toast('เบราว์เซอร์บล็อกหน้าต่างใหม่', true); }
      return; }
    if (tool || e.target.closest('.pv-bar,.cs-side,.pv-notes')) return;
    if (dual) { if (e.target.closest('#csCur')) show(i + 1); return; }
    show(i + (e.clientX > ov.clientWidth * 0.3 ? 1 : -1));
  });
  document.addEventListener('keydown', key); window.addEventListener('resize', fitAll); document.addEventListener('fullscreenchange', fitAll);
  if (dual) {
    setupAud();
    tick = setInterval(function () { var t = $('#csT', ov); if (!t) return; t.textContent = fmtT((pausedAt || Date.now()) - t0); var d = new Date(); $('#csClock', ov).textContent = d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() + ' น.'; }, 500);
  } else if (ov.requestFullscreen) ov.requestFullscreen().catch(function () {});
  setTool(''); fitAll(); show(i); wake();
  setTimeout(fitAll, 120);
}

/* ===================== backup / restore ===================== */
async function doBackup() {
  var out = { app: 'sitepresent', version: APP_VERSION, exported: new Date().toISOString(), projects: await DB.all('projects'), pres: await DB.all('pres'), photos: await DB.all('photos') };
  var blob = new Blob([JSON.stringify(out)], { type: 'application/json' }), u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = 'สำรอง_นำเสนอผลงาน_' + iso(today()) + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 30000);
  toast('สำรองข้อมูลแล้ว');
}
async function doRestore(file) {
  var d; try { d = JSON.parse(await file.text()); } catch (e) { throw new Error('ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอปนำเสนอผลงาน'); }
  if (!d || d.app !== 'sitepresent') throw new Error('ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอปนำเสนอผลงาน');
  if (!confirm('กู้คืน ' + (d.pres || []).length + ' ชุดนำเสนอ และ ' + (d.photos || []).length + ' รูป จากไฟล์วันที่ ' + th((d.exported || '').slice(0, 10)) + '? (รายการที่ซ้ำจะใช้ข้อมูลจากไฟล์)')) return;
  for (var k of ['projects', 'pres', 'photos']) for (var o of (d[k] || [])) await DB.put(k, o);
  toast('กู้คืนแล้ว'); render();
}

function printAll() {
  snapshot();
  var slides = buildSlides(S.C, S.pr, S.photos, true);
  $('#printRoot').innerHTML = slides.map(function (s) { return s.html; }).join('');
  var done = function () { $('#printRoot').innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(function () { window.print(); }, 200);
}

/* ---- events ---- */
document.addEventListener('click', async function (e) {
  var el = e.target.closest('[data-go],[data-act],[data-delp],[data-add],[data-rm],[data-mode],[data-period],[data-delph],[data-ntreset],[data-cimgdel],.thumb'); if (!el) return;
  try {
    if (el.dataset.delp) {
      e.stopPropagation(); if (!confirm('ลบโครงการนี้ออกจากแอปนำเสนอ? (ไม่กระทบ site-control)')) return;
      var id = el.dataset.delp; await DB.del('projects', id); await DB.del('pres', id);
      (await DB.byProject('photos', id)).forEach(function (p) { DB.del('photos', p.id); }); toast('ลบแล้ว'); go('/'); return;
    }
    if (el.dataset.go != null) return go(el.dataset.go);
    if (el.dataset.ntreset) { delete S.pr.notes[el.dataset.ntreset]; await DB.put('pres', S.pr); refresh(); return; }
    if (el.dataset.cimgdel != null) { S.pr.custom[+el.dataset.cimgdel].img = ''; await DB.put('pres', S.pr); rerender(); return; }
    if (el.classList.contains('thumb')) { var n = +el.dataset.start; if (n >= 0) present(n); return; }
    if (el.dataset.mode) { S.pr.mode = el.dataset.mode; S.pr.slides = {}; await DB.put('pres', S.pr); return rerender(); }
    if (el.dataset.period) { S.pr.period = +el.dataset.period; await DB.put('pres', S.pr); return rerender(); }
    if (el.dataset.add) {
      var k = el.dataset.add; S.pr[k] = S.pr[k] || [];
      S.pr[k].push(k === 'issues' ? { problem: '', impact: '', fix: '', owner: '' } : k === 'requests' ? { text: '', detail: '' } : k === 'custom' ? { id: uid(), title: '', sub: '', body: '', img: '' } : { label: 'งวดที่ ' + (S.pr[k].length + 1), amount: '', due: '', submitted: '', accepted: '', paid: '' });
      await DB.put('pres', S.pr); rerender(); return;
    }
    if (el.dataset.rm) { S.pr[el.dataset.rm].splice(+el.dataset.i, 1); await DB.put('pres', S.pr); rerender(); return; }
    if (el.dataset.delph) { await DB.del('photos', el.dataset.delph); S.photos = S.photos.filter(function (p) { return p.id !== el.dataset.delph; }); rerender(); return; }
    var a = el.dataset.act;
    if (a === 'demo') { var did = await createDemo(); go('/p/' + did); }
    else if (a === 'present') present(0);
    else if (a === 'present2') present(0, true);
    else if (a === 'pptx') await exportPptx();
    else if (a === 'backup') await doBackup();
    else if (a === 'print') printAll();
    else if (a === 'logoDel') { S.pr.logo = ''; await DB.put('pres', S.pr); rerender(); }
    else if (a === 'instEdit') { S.pr.inst = (S.P.inst || []).map(function (x) { return Object.assign({}, x); }); await DB.put('pres', S.pr); rerender(); }
    else if (a === 'instSrc') { S.pr.inst = null; await DB.put('pres', S.pr); rerender(); }
  } catch (err) { console.error(err); toast(err.message, true); }
});
document.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.pitem[role=button]')) { e.preventDefault(); go(e.target.dataset.go); } });
document.addEventListener('input', function (e) {
  var t = e.target; if (!S.pr) return;
  if (t.dataset.k) { setPath(S.pr, t.dataset.k, t.type === 'number' ? (t.value === '' ? '' : num(t.value)) : t.value); if (t.dataset.k === 'meeting.title' || t.dataset.k.indexOf('meeting') === 0) {} savePr(); }
  else if (t.dataset.l) { S.pr[t.dataset.l][+t.dataset.i][t.dataset.f] = t.value; savePr(); }
  else if (t.dataset.note) { S.pr.notes = S.pr.notes || {}; S.pr.notes[t.dataset.note] = t.value; savePr(false); }
  else if (t.dataset.c) { S.pr.contract = S.pr.contract || {}; S.pr.contract[t.dataset.c] = t.value.replace(/,/g, ''); if (t.dataset.c === 'name') $('#tTitle').textContent = project(S.P, S.pr).name; savePr(); }
  else if (t.dataset.ph) { var p = S.photos.filter(function (x) { return x.id === t.dataset.ph; })[0]; if (p) { p.caption = t.value; clearTimeout(p._t); p._t = setTimeout(function () { var o = Object.assign({}, p); delete o._t; DB.put('photos', o); refresh(); }, 400); } }
});
document.addEventListener('change', async function (e) {
  var t = e.target;
  try {
    if (t.dataset.sl) { S.pr.slides = S.pr.slides || {}; S.pr.slides[t.dataset.sl] = t.checked; await DB.put('pres', S.pr); refresh(); return; }
    if (t.id === 'xlsxFile' && t.files[0]) { var P = await importXlsx(t.files[0]); go('/p/' + P.id); }
    else if (t.id === 'xlsxUpd' && t.files[0]) { await importXlsx(t.files[0], S.P.id); rerender(); }
    else if (t.dataset.cimg != null && t.files[0]) { S.pr.custom[+t.dataset.cimg].img = await readImage(t.files[0], 1400, 0.85); await DB.put('pres', S.pr); rerender(); }
    else if (t.id === 'restoreFile' && t.files[0]) await doRestore(t.files[0]);
    else if (t.id === 'logoFile' && t.files[0]) { S.pr.logo = await readImage(t.files[0], 480, 0); await DB.put('pres', S.pr); rerender(); }
    else if (t.id === 'photoFile' && t.files.length) {
      toast('กำลังเพิ่มรูป…'); var base = S.photos.length;
      for (var i = 0; i < t.files.length; i++) { var f = t.files[i], o = { id: uid() + i, projectId: S.P.id, data: await readImage(f, 1600, 0.82), caption: '', date: fileDate(f), order: base + i + 1 }; await DB.put('photos', o); S.photos.push(o); }
      toast('เพิ่มรูปแล้ว ' + t.files.length + ' รูป'); rerender();
    }
  } catch (err) { console.error(err); toast(err.message, true); }
  if (t.type === 'file') t.value = '';
});
window.addEventListener('hashchange', function () { render().then(function () { window.scrollTo(0, 0); }); });
$('#brand').addEventListener('click', function () { go('/'); });
function registerSW() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:' || !/github\.io$/.test(location.hostname)) return;
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    reg.addEventListener('updatefound', function () { var nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', function () {
      if (nw.state === 'installed' && navigator.serviceWorker.controller) { var b = document.createElement('div'); b.className = 'toast'; b.innerHTML = 'มีเวอร์ชันใหม่ <button class="btn sm go" id="updNow">อัปเดต</button>'; document.body.appendChild(b); $('#updNow').onclick = function () { nw.postMessage('skipWaiting'); }; }
    }); });
  }).catch(function () {});
  var re = false; navigator.serviceWorker.addEventListener('controllerchange', function () { if (!re) { re = true; location.reload(); } });
}
(async function () {
  try { await openDB(); } catch (e) { $('#main').innerHTML = '<section class="panel"><h2>เปิดที่เก็บข้อมูลไม่ได้</h2><p>' + esc(e.message) + '</p><p class="muted">ถ้าใช้โหมดไม่ระบุตัวตน ให้เปิดแบบปกติ</p></section>'; return; }
  registerSW(); render();
})();
